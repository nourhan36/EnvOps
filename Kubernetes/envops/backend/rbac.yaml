apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: envops-backend-sandbox-manager
  labels:
    app.kubernetes.io/part-of: envops
  annotations:
    argocd.argoproj.io/sync-wave: "0"

rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: envops-backend-sandbox-manager
  labels:
    app.kubernetes.io/part-of: envops
subjects:
  - kind: ServiceAccount
    name: envops-backend
    namespace: envops-core
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: envops-backend-sandbox-manager
