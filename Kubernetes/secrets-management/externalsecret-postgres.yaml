apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: envops-core
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store      
    kind: SecretStore
  target:
    name: postgres-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        dbname: "{{ .dbname }}"
        # URL-encode credentials so password rotation can safely use reserved characters.
        DATABASE_URL: "postgresql://{{ .username | urlquery }}:{{ .password | urlquery }}@envops-postgres-postgresql.envops-core.svc.cluster.local:5432/{{ .dbname | urlquery }}"
  data:
    - secretKey: username
      remoteRef:
        key: envops/postgres-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: envops/postgres-credentials
        property: password
    - secretKey: dbname
      remoteRef:
        key: envops/postgres-credentials
        property: dbname
