apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-credentials
  namespace: envops-core
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: redis-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
        REDIS_URL: "redis://:{{ .password | urlquery }}@envops-redis-master.envops-core.svc.cluster.local:6379"
  data:
    - secretKey: password
      remoteRef:
        key: envops/redis-credentials
        property: password
