services:
  postgres:
    image: postgres:16
    container_name: envops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: envops_admin
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: envops
   
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: envops_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redisdata:/data


  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile

    image: envops/backend:latest
    container_name: envops_backend
    restart: unless-stopped

    env_file:
      - ../apps/backend/.env

    environment:
      DATABASE_URL: postgresql://envops_admin:local_dev_password@postgres:5432/envops
      REDIS_URL: redis://redis:6379

    ports:
      - "3000:3000"

    depends_on:
      - postgres
      - redis


  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile

    image: envops/frontend:latest
    container_name: envops_frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend


volumes:

  pgdata:

  redisdata: